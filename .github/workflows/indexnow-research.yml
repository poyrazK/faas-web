name: Submit changed pages to IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  # Reads the page hashes the previous run saved, to submit only changed pages.
  actions: read
  contents: read
  deployments: read

jobs:
  submit:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.deployment.environment == 'Production' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       github.event.deployment_status.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/submit-research-indexnow.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # The next run compares against these hashes. Written only after a
      # successful submission, so a failed one is retried in full.
      - uses: actions/upload-artifact@v6
        with:
          name: indexnow-content
          path: indexnow-content.json
          if-no-files-found: ignore
          retention-days: 90
