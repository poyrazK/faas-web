name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a quick follow-up commit makes the in-flight run pointless;
# cancel it rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7: v4 targets Node 20, which the runners now force onto Node 24 and
      # warn about on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `ci` over `install`: fails on a lockfile that disagrees with
      # package.json rather than silently resolving something new.
      - run: npm ci

      # Build bundle/prerender concurrently with typecheck (eliminating a
      # duplicate `tsc` pass), lint, and format checks before running tests so
      # `src/prerender.test.ts` asserts against freshly built `dist/`.
      - run: node scripts/run-parallel.mjs build:bundle typecheck lint format:check

      - run: npm run test:node && npm run test:jsdom
